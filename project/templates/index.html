<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediScan AI - Disease Risk Predictor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #222;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; background: rgba(255,255,255,0.95); border-radius: 20px; padding: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; margin-bottom: 30px; font-size: 2.5em; }
        form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        label { font-weight: bold; color: #444; display: block; margin-bottom: 5px; }
        input[type="number"] { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; transition: border-color 0.3s; }
        input[type="number"]:focus { outline: none; border-color: #667eea; }
        button { grid-column: 1 / -1; padding: 15px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; font-size: 1.2em; cursor: pointer; transition: transform 0.2s; }
        button:hover { transform: translateY(-2px); }
        .results { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); padding: 30px; border-radius: 15px; margin-top: 20px; display: none; }
.results.show { display: block; animation: fadeIn 0.5s; }
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .health-score { text-align: center; font-size: 3em; font-weight: bold; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin: 20px 0; }
        .risks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin: 20px 0; }
        .risk-item { background: rgba(255,255,255,0.9); padding: 15px; border-radius: 10px; text-align: center; font-weight: bold; }
        .tips { background: rgba(255,255,255,0.9); padding: 20px; border-radius: 10px; margin-top: 20px; }
        .tip { margin: 10px 0; padding: 10px; background: #e8f4f8; border-left: 4px solid #667eea; }
@media(max-width:600px){.container{padding:20px}h1{font-size:2em}}
    </style>
</head>
<body>
    <div class="container">
<h1>🏥 MediScan AI</h1>
        <h2 style="text-align: center; color: #555; margin-bottom: 30px;">Lifestyle Disease Risk Assessment</h2>
        <form method="POST">
            <div>
                <label for="age">Age:</label>
required>
            </div>
            <div>
                <label for="gender">Gender (0=F, 1=M):</label>
                <input type="number" id="gender" name="gender" min="0" max="1" required>
            </div>
            <div>
                <label for="bmi">BMI:</label>
                <input type="number" id="bmi" name="bmi" step="0.1" min="10" max="60" required>
            </div>
            <div>
                <label for="blood_pressure">Blood Pressure (mmHg):</label>
                <input type="number" id="blood_pressure" name="blood_pressure" step="1" min="50" max="250" required>
            </div>
            <div>
                <label for="glucose">Glucose (mg/dL):</label>
                <input type="number" id="glucose" name="glucose" step="1" min="50" max="500" required>
            </div>
            <div>
                <label for="cholesterol">Cholesterol (mg/dL):</label>
                <input type="number" id="cholesterol" name="cholesterol" step="1" min="100" max="500" required>
            </div>
            <div>
                <label for="smoking">Smoking (0=No, 1=Yes):</label>
                <input type="number" id="smoking" name="smoking" min="0" max="1" required>
            </div>
            <div>
                <label for="activity">Activity Level (0=Low, 1=High):</label>
                <input type="number" id="activity" name="activity" min="0" max="1" required>
            </div>
            <button type="submit">Calculate Risks ⚡</button>
        </form>
        
        {% if health_score %}
        <div class="results show">
            <div class="health-score" style="color: {% if health_score > 70 %}#4CAF50{% elif health_score > 50 %}#FF9800{% else %}#f44336{% endif %};">
                Health Score: {{ health_score }}/100
            </div>
            <h3 style="color: white; text-align: center; margin-bottom: 20px;">Disease Risks</h3>
            <div class="risks">
                {% for disease, risk in risks.items() %}
                <div class="risk-item" style="color: {% if risk > 0.6 %}#f44336{% elif risk > 0.3 %}#FF9800{% else %}#4CAF50{% endif %}">
                    {{ disease }}: {{ risk*100 }}%
                </div>
                {% endfor %}
            </div>
            <h3 style="color: white; margin-top: 20px;">Personalized Tips</h3>
            <div class="tips">
                {% for tip in tips %}
                <div class="tip">{{ tip }}</div>
                {% endfor %}
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
